  <rect class="badge" x="288" y="174" width="28" height="13" rx="6.5"/>
  <text class="badge-text" x="302" y="184" text-anchor="middle">중복</text>
  <rect x="182" y="214" width="128" height="26" rx="5" fill="#10b981"/>
  <text class="blk" x="246" y="232" text-anchor="middle">검증 6단계</text>
  <rect class="badge" x="288" y="208" width="28" height="13" rx="6.5"/>
  <text class="badge-text" x="302" y="218" text-anchor="middle">중복</text>
  <rect class="own" x="182" y="248" width="128" height="26" rx="5"/>
  <text class="blk-dim" x="246" y="266" text-anchor="middle">worktree · 충돌 분류</text>
  <rect class="own" x="182" y="282" width="128" height="26" rx="5"/>
  <text class="blk-dim" x="246" y="300" text-anchor="middle">합의가 필요한 변경</text>

  <!-- col3 -->
  <rect class="own" x="318" y="146" width="128" height="26" rx="5"/>
