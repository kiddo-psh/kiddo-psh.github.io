    <text class="legend" x="341" y="11">테스트 약화 금지</text>
    <rect x="456" y="0" width="13" height="13" rx="3" fill="#8b5cf6"/>
    <text class="legend" x="475" y="11">스토리 포인트 기준</text>
    <rect class="own" x="600" y="0" width="13" height="13" rx="3"/>
