  <text class="ref-text" x="599" y="300" text-anchor="middle" fill="#8b5cf6">→ jira/README</text>

  <!-- col2 -->
  <rect class="ref" x="668" y="146" width="122" height="26" rx="5" stroke="#3b82f6"/>
  <text class="ref-text" x="729" y="164" text-anchor="middle" fill="#3b82f6">→ AGENTS.md</text>
