<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="t2 d2">
  <title id="t2">같은 규칙, 몇 곳에 있었나</title>
  <desc id="d2">정리 전에는 시작 전 확인, 완료 보고, 검증 항목의 정의가 AGENTS.md와 ai-collaboration.md 두 곳에, 스토리 포인트 기준이 AGENTS.md와 jira/README.md 두 곳에 있었다. 정리 후에는 각 규칙의 정의가 한 곳에만 있고 다른 문서는 참조만 한다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --blue:#2a78d6; --blue-soft:#e3eefb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --blue:#3987e5; --blue-soft:#1f3350; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "D2Coding", monospace; }
    .bg { fill: var(--bg); }
    .hd { font-size: 16px; font-weight: 700; }
    .doc { font-size: 12px; fill: var(--ink2); }
    .chip { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
    .chip.ref { fill: var(--bg); stroke: var(--line); stroke-dasharray: 4 3; }
    .ct { font-size: 13px; font-weight: 600; }
    .ct.ref { font-weight: 500; fill: var(--ink2); }
    .arrow { fill: var(--ink2); }
    .lg { font-size: 12px; fill: var(--ink2); }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="290" rx="12"/>

  <!-- ===== Before ===== -->
  <text class="hd" x="45" y="44">Before</text>
  <g class="mono doc" text-anchor="middle">
    <text x="105" y="70">AGENTS.md</text>
    <text x="245" y="70">ai-collaboration.md</text>
    <text x="385" y="70">jira/README.md</text>
  </g>

  <!-- row 1: 시작 전 확인 -->
  <rect class="chip" x="45" y="84" width="120" height="30" rx="15"/><text class="ct" x="105" y="104" text-anchor="middle">시작 전 확인</text>
  <rect class="chip" x="185" y="84" width="120" height="30" rx="15"/><text class="ct" x="245" y="104" text-anchor="middle">시작 전 확인</text>
  <!-- row 2: 완료 보고 -->
  <rect class="chip" x="45" y="124" width="120" height="30" rx="15"/><text class="ct" x="105" y="144" text-anchor="middle">완료 보고</text>
  <rect class="chip" x="185" y="124" width="120" height="30" rx="15"/><text class="ct" x="245" y="144" text-anchor="middle">완료 보고</text>
  <!-- row 3: 검증 항목 -->
  <rect class="chip" x="45" y="164" width="120" height="30" rx="15"/><text class="ct" x="105" y="184" text-anchor="middle">검증 항목</text>
  <rect class="chip" x="185" y="164" width="120" height="30" rx="15"/><text class="ct" x="245" y="184" text-anchor="middle">검증 항목</text>
  <!-- row 4: SP 산정 기준 -->
  <rect class="chip" x="45" y="204" width="120" height="30" rx="15"/><text class="ct" x="105" y="224" text-anchor="middle">SP 산정 기준</text>
  <rect class="chip" x="325" y="204" width="120" height="30" rx="15"/><text class="ct" x="385" y="224" text-anchor="middle">SP 산정 기준</text>

  <!-- ===== big arrow ===== -->
  <path class="arrow" d="M466 152 L486 152 L486 142 L504 159 L486 176 L486 166 L466 166 Z"/>

  <!-- ===== After ===== -->
  <text class="hd" x="525" y="44">After</text>
  <g class="mono doc" text-anchor="middle">
    <text x="585" y="70">AGENTS.md</text>
    <text x="725" y="70">ai-collaboration.md</text>
    <text x="865" y="70">jira/README.md</text>
  </g>

  <rect class="chip" x="525" y="84" width="120" height="30" rx="15"/><text class="ct" x="585" y="104" text-anchor="middle">시작 전 확인</text>
  <rect class="chip ref" x="665" y="84" width="120" height="30" rx="15"/><text class="ct ref" x="725" y="104" text-anchor="middle">→ AGENTS.md</text>

  <rect class="chip" x="525" y="124" width="120" height="30" rx="15"/><text class="ct" x="585" y="144" text-anchor="middle">완료 보고</text>
  <rect class="chip ref" x="665" y="124" width="120" height="30" rx="15"/><text class="ct ref" x="725" y="144" text-anchor="middle">→ AGENTS.md</text>

  <rect class="chip" x="525" y="164" width="120" height="30" rx="15"/><text class="ct" x="585" y="184" text-anchor="middle">검증 항목</text>
  <rect class="chip ref" x="665" y="164" width="120" height="30" rx="15"/><text class="ct ref" x="725" y="184" text-anchor="middle">→ AGENTS.md</text>

  <rect class="chip ref" x="525" y="204" width="120" height="30" rx="15"/><text class="ct ref" x="585" y="224" text-anchor="middle">→ jira/README</text>
  <rect class="chip" x="805" y="204" width="120" height="30" rx="15"/><text class="ct" x="865" y="224" text-anchor="middle">SP 산정 기준</text>

  <!-- legend -->
  <rect class="chip" x="45" y="258" width="14" height="14" rx="4"/>
  <text class="lg" x="67" y="270">규칙의 정의</text>
  <rect class="chip ref" x="160" y="258" width="14" height="14" rx="4"/>
  <text class="lg" x="182" y="270">참조만 · 정의 없음</text>
</svg>
