  <rect class="ref" x="668" y="214" width="122" height="26" rx="5" stroke="#10b981"/>
  <text class="ref-text" x="729" y="232" text-anchor="middle" fill="#10b981">→ AGENTS.md</text>
  <rect class="own" x="668" y="248" width="122" height="26" rx="5"/>
  <text class="blk-dim" x="729" y="266" text-anchor="middle">worktree · 충돌 분류</text>
  <rect class="own" x="668" y="282" width="122" height="26" rx="5"/>
  <text class="blk-dim" x="729" y="300" text-anchor="middle">합의가 필요한 변경</text>

  <!-- col3 -->
  <rect class="own" x="798" y="146" width="122" height="26" rx="5"/>
  <text class="blk-dim" x="859" y="164" text-anchor="middle">스크립트 사용법</text>
  <rect class="own" x="798" y="180" width="122" height="26" rx="5"/>
  <text class="blk-dim" x="859" y="198" text-anchor="middle">계획 YAML 형식</text>
  <rect x="798" y="214" width="122" height="26" rx="5" fill="#8b5cf6"/>
  <text class="blk" x="859" y="232" text-anchor="middle">SP 산정 기준 (표 포함)</text>

  <!-- reference arrows -->
  <line class="edge" x1="668" y1="159" x2="662" y2="159" marker-end="url(#a2)"/>
  <line class="edge" x1="668" y1="193" x2="662" y2="193" marker-end="url(#a2)"/>
  <line class="edge" x1="668" y1="227" x2="662" y2="227" marker-end="url(#a2)"/>
  <polyline class="edge" points="599,308 599,326 859,326 859,242" marker-end="url(#a2)"/>

  <text class="panel-sub" x="538" y="356">AGENTS.md 118줄 · ai-collaboration.md 144줄</text>

