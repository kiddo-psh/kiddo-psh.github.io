  <rect class="own" x="318" y="180" width="128" height="26" rx="5"/>
  <text class="blk-dim" x="382" y="198" text-anchor="middle">계획 YAML 형식</text>
  <rect x="318" y="214" width="128" height="26" rx="5" fill="#8b5cf6"/>
  <text class="blk" x="382" y="232" text-anchor="middle">SP 산정 기준 (표 포함)</text>

  <text class="panel-sub" x="46" y="356">AGENTS.md 122줄 · ai-collaboration.md 185줄</text>

  <!-- ===== big arrow ===== -->
  <path d="M 470 216 L 492 216 L 492 206 L 512 222 L 492 238 L 492 228 L 470 228 Z" class="arrow"/>

  <!-- ===== AFTER ===== -->
  <rect class="panel" x="522" y="72" width="408" height="300" rx="10"/>
  <text class="panel-title" x="538" y="96">After</text>
  <text class="panel-sub" x="586" y="96">정의는 한 곳, 나머지는 참조</text>

  <g class="mono">
    <rect class="doc" x="538" y="110" width="122" height="26" rx="5"/>
    <text class="doc-name" x="599" y="128" text-anchor="middle">AGENTS.md</text>
    <rect class="doc" x="668" y="110" width="122" height="26" rx="5"/>
    <text class="doc-name" x="729" y="128" text-anchor="middle">ai-collaboration.md</text>
    <rect class="doc" x="798" y="110" width="122" height="26" rx="5"/>
    <text class="doc-name" x="859" y="128" text-anchor="middle">jira/README.md</text>
  </g>

  <!-- col1 -->
  <rect x="538" y="146" width="122" height="26" rx="5" fill="#3b82f6"/>
  <text class="blk" x="599" y="164" text-anchor="middle">시작 전 확인 (통합)</text>
  <rect x="538" y="180" width="122" height="26" rx="5" fill="#f59e0b"/>
  <text class="blk" x="599" y="198" text-anchor="middle">알림 · 보고 (양식 없음)</text>
  <rect x="538" y="214" width="122" height="26" rx="5" fill="#10b981"/>
