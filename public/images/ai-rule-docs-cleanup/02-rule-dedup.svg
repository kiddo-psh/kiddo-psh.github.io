<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t2 d2">
  <title id="t2">같은 규칙, 몇 곳에 있었나</title>
  <desc id="d2">정리 전에는 시작 전 확인, 보고 양식, 검증 항목이 AGENTS.md와 ai-collaboration.md에 서로 다른 형태로 있었고 스토리 포인트 기준은 AGENTS.md와 Jira 도구 문서에 있었다. 정리 후에는 정의를 한 곳에만 두고 나머지 문서는 참조만 한다. AGENTS.md는 122줄에서 118줄, ai-collaboration.md는 185줄에서 144줄이 됐다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "D2Coding", monospace; }
    .bg { fill: var(--bg); }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink2); }
    .panel { fill: var(--bg2); stroke: var(--line); stroke-width: 1; }
    .panel-title { font-size: 15px; font-weight: 700; }
    .panel-sub { font-size: 12px; fill: var(--ink2); }
    .doc { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .doc-name { font-size: 11.5px; }
    .blk { font-size: 11px; fill: #ffffff; font-weight: 600; }
    .blk-dim { font-size: 11px; fill: var(--ink2); }
    .own { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .ref { fill: var(--bg); stroke-width: 1.4; stroke-dasharray: 4 3; }
    .ref-text { font-size: 11px; font-weight: 600; }
    .badge { fill: #fee2e2; stroke: #ef4444; stroke-width: 1; }
    .badge-text { font-size: 9.5px; fill: #b91c1c; font-weight: 700; }
    .edge { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
    .arrow { fill: var(--ink2); }
    .legend { font-size: 12px; fill: var(--ink2); }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="430"/>

  <text class="title" x="30" y="36">같은 규칙, 몇 곳에 있었나</text>
  <text class="sub" x="30" y="56">정의는 한 곳에 두고, 나머지 문서는 참조만 하도록 바꿨다.</text>

  <!-- ===== BEFORE ===== -->
  <rect class="panel" x="30" y="72" width="430" height="300" rx="10"/>
  <text class="panel-title" x="46" y="96">Before</text>
  <text class="panel-sub" x="104" y="96">같은 규칙이 두세 곳에, 항목 수와 순서는 제각각</text>

  <g class="mono">
    <rect class="doc" x="46" y="110" width="128" height="26" rx="5"/>
    <text class="doc-name" x="110" y="128" text-anchor="middle">AGENTS.md</text>
    <rect class="doc" x="182" y="110" width="128" height="26" rx="5"/>
    <text class="doc-name" x="246" y="128" text-anchor="middle">ai-collaboration.md</text>
    <rect class="doc" x="318" y="110" width="128" height="26" rx="5"/>
    <text class="doc-name" x="382" y="128" text-anchor="middle">jira/README.md</text>
  </g>

