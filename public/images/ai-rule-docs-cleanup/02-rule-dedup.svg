  <text class="sub" x="824" y="148" text-anchor="middle">규칙의 정의는 여기만</text>
  <rect class="n q" x="744" y="243" width="160" height="38" rx="3"/>
  <text class="l q sm" x="824" y="266.7" text-anchor="middle">ai-collaboration.md</text>
