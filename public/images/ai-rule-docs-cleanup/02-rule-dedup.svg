  <text class="blk" x="110" y="300" text-anchor="middle">SP 산정 기준 (3항목)</text>
  <rect class="badge" x="152" y="276" width="28" height="13" rx="6.5"/>
  <text class="badge-text" x="166" y="286" text-anchor="middle">중복</text>

  <!-- col2 -->
  <rect x="182" y="146" width="128" height="26" rx="5" fill="#3b82f6"/>
  <text class="blk" x="246" y="164" text-anchor="middle">시작 전 확인 (7항목)</text>
  <rect class="badge" x="288" y="140" width="28" height="13" rx="6.5"/>
  <text class="badge-text" x="302" y="150" text-anchor="middle">중복</text>
  <rect x="182" y="180" width="128" height="26" rx="5" fill="#f59e0b"/>
