<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="t1 d1">
  <title id="t1">규칙 문서의 역할 계층</title>
  <desc id="d1">AI 작업 절차, 규칙, 안내 세 층. AGENTS.md는 규칙 문서와 설계·계약 문서를 따르고, ai-collaboration.md와 서로의 역할을 선언한다. 안내 문서는 규칙을 정의하지 않고 규칙 문서를 링크만 한다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --blue:#2a78d6; --blue-soft:#e3eefb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --blue:#3987e5; --blue-soft:#1f3350; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "D2Coding", monospace; }
    .bg { fill: var(--bg); }
    .pill { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .pill.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .step { font-size: 16px; font-weight: 600; }
    .who { font-size: 15px; font-weight: 600; }
    .flow { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
    .flow.dash { stroke-dasharray: 6 4; }
    .arrow { fill: var(--ink2); }
    .lbl { font-size: 12px; fill: var(--ink2); }
    .lg { font-size: 12px; fill: var(--ink2); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="350" rx="12"/>

  <!-- row 1: AI 작업 절차 -->
  <text class="who" x="30" y="82">AI 작업 절차</text>
  <rect class="pill hi" x="200" y="50" width="260" height="52" rx="26"/>
  <text class="mono step" x="330" y="82" text-anchor="middle">AGENTS.md</text>
  <rect class="pill" x="580" y="50" width="300" height="52" rx="26"/>
  <text class="mono step" x="730" y="82" text-anchor="middle">ai-collaboration.md</text>
  <path class="flow" d="M464 76 H576" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="lbl" x="520" y="66" text-anchor="middle">서로의 역할 선언</text>

  <!-- row 2: 규칙 -->
  <text class="who" x="30" y="182">규칙</text>
  <rect class="pill" x="200" y="150" width="260" height="52" rx="26"/>
  <text class="step" x="330" y="182" text-anchor="middle">규칙 · 컨벤션</text>
  <rect class="pill" x="580" y="150" width="300" height="52" rx="26"/>
  <text class="step" x="730" y="182" text-anchor="middle">설계 · 계약</text>

  <!-- row 3: 안내 -->
  <text class="who" x="30" y="282">안내</text>
  <rect class="pill" x="200" y="250" width="260" height="52" rx="26"/>
  <text class="step" x="330" y="282" text-anchor="middle">README · 절차 안내</text>

  <!-- AGENTS.md → 규칙, 설계·계약 -->
  <path class="flow" d="M290 102 V147" marker-end="url(#ar)"/>
  <text class="lbl" x="300" y="130">따른다</text>
  <path class="flow" d="M400 102 V126 H730 V147" marker-end="url(#ar)"/>

  <!-- 안내 --> 규칙 (링크만) -->
  <path class="flow dash" d="M330 250 V205" marker-end="url(#ar)"/>
  <text class="lbl" x="340" y="232">링크만 한다</text>

  <!-- legend -->
  <path class="flow" d="M30 326 H62" marker-end="url(#ar)"/>
  <text class="lg" x="70" y="330">규칙을 따른다</text>
  <path class="flow dash" d="M190 326 H222" marker-end="url(#ar)"/>
  <text class="lg" x="230" y="330">링크만 한다 · 규칙을 새로 정의하지 않는다</text>
</svg>
