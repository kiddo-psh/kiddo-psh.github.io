<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">절차를 줄인 것이 아니라 갈래로 나눴다</title>
  <desc id="d">기존에는 어떤 코드 변경이든 플랜, 테스트 선행, 구현, 검토 네 단계를 각각 새 세션으로 거쳤다. 개정 후에는 위험 트리거 판정이 세 갈래를 고른다. 검증만은 빌드만 확인하고, 기본은 플랜부터 빌드까지 한 세션에서 마치며, 게이트는 기본 절차에 A와 B의 독립 리뷰를 더한다. 판정이 앞에 서므로 절차가 짧아진 것이 아니라 변경에 따라 갈라진 것이다.</desc>
  <style>
    /*
     * 공통 도해 문법 — docs/diagrams.md 참조. 9장이 같은 규칙을 쓴다.
     *
     * 색은 "무엇인가"가 아니라 "어떤 역할인가"를 말한다.
     *   g 초록  코드가 실제로 바뀌는 단계
     *   v 보라  사람이 기준을 정하거나 확인하는 지점 (문서 · 판정 · 리뷰 · 게이트)
     *   t 주황  경계 — 들어오고 나가는 지점, 그리고 되돌아간 비용
     *   q 회색  맥락. 이 그림의 주인공이 아닌 것
     * 한 칸은 면 · 선 · 글자를 같은 색 한 벌로 쓴다. 색이 역할이므로 강조용 테두리를
     * 따로 두지 않는다.
     *
     * 설명은 칸이 아니라 선과 여백이 한다. 칸 안에는 이름 한 줄만 넣고, 무엇이
     * 흐르는지는 선 위 이름표로, 그 칸이 무슨 일을 하는지는 칸 아래 작은 글로 쓴다.
     */
    :root {
      --ink:#23211d; --ink2:#57534a; --hair:#cec8bb; --arrow:#a39c91;
      --g-fill:#e7f0ea; --g-line:#4e8f74; --g-text:#1d6b4f;
      --v-fill:#ecebf4; --v-line:#7d74ab; --v-text:#544a87;
      --t-fill:#f7ebe3; --t-line:#c07a4e; --t-text:#9c4a15;
      --q-fill:#f4f1ea; --q-line:#cec8bb; --q-text:#57534a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:#edeae3; --ink2:#a8a199; --hair:#3f3b35; --arrow:#6f685f;
        --g-fill:#1d2a24; --g-line:#3f7a5f; --g-text:#4fbe8f;
        --v-fill:#24222e; --v-line:#6a5f96; --v-text:#a396d8;
        --t-fill:#2c211a; --t-line:#8f5c38; --t-text:#d98b52;
        --q-fill:#2a2724; --q-line:#4a453e; --q-text:#a8a199;
      }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }

    .n { stroke-width:1.5; }
    .n.g { fill:var(--g-fill); stroke:var(--g-line); }
    .n.v { fill:var(--v-fill); stroke:var(--v-line); }
    .n.t { fill:var(--t-fill); stroke:var(--t-line); }
    .n.q { fill:var(--q-fill); stroke:var(--q-line); }

    .l { font-size:15px; font-weight:700; }
    .l.g { fill:var(--g-text); } .l.v { fill:var(--v-text); }
    .l.t { fill:var(--t-text); } .l.q { fill:var(--q-text); }
    .l.sm { font-size:13.5px; }

    .e { fill:none; stroke:var(--arrow); stroke-width:1.8; }
    .e.d { stroke-dasharray:5 4; }
    .e.t { stroke:var(--t-line); stroke-width:1.4; }
    .ah { fill:var(--arrow); }
    .el { font-size:13.5px; fill:var(--ink2); }

    .sub { font-size:13px; fill:var(--ink2); }
    /* 그림이 가리키는 한 곳을 이름으로 부를 때. 가리키는 칸과 같은 색을 쓴다 */
    .sub.g { fill:var(--g-text); font-weight:700; }
    .sub.v { fill:var(--v-text); font-weight:700; }
    .sub.t { fill:var(--t-text); font-weight:700; }
    .hd { font-size:16px; font-weight:700; fill:var(--ink); }
    .grp { fill:none; stroke:var(--hair); stroke-width:1.2; stroke-dasharray:5 4; }
    .rule { stroke:var(--hair); stroke-width:1; }

    .bar.g { fill:var(--g-text); } .bar.t { fill:var(--t-text); } .bar.q { fill:var(--q-line); }
    .tick { font-size:12.5px; fill:var(--ink2); }
    .grid { stroke:var(--hair); stroke-width:1; stroke-dasharray:2 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <text class="hd" x="56" y="46" text-anchor="start">기존</text>
  <text class="sub" x="100" y="46" text-anchor="start">코드 변경마다 같은 4단계 · 단계마다 새 세션</text>
  <rect class="grp" x="48" y="74" width="132" height="58" rx="6"/>
  <rect class="n v" x="56" y="84" width="116" height="38" rx="3"/>
  <text class="l v sm" x="114" y="107.7" text-anchor="middle">플랜</text>
  <rect class="grp" x="228" y="74" width="132" height="58" rx="6"/>
  <rect class="n g" x="236" y="84" width="116" height="38" rx="3"/>
  <text class="l g sm" x="294" y="107.7" text-anchor="middle">테스트 선행</text>
  <path class="e" d="M184 103 H222" marker-end="url(#a)"/>
  <rect class="grp" x="408" y="74" width="132" height="58" rx="6"/>
  <rect class="n g" x="416" y="84" width="116" height="38" rx="3"/>
  <text class="l g sm" x="474" y="107.7" text-anchor="middle">구현</text>
  <path class="e" d="M364 103 H402" marker-end="url(#a)"/>
  <rect class="grp" x="588" y="74" width="132" height="58" rx="6"/>
  <rect class="n v" x="596" y="84" width="116" height="38" rx="3"/>
  <text class="l v sm" x="654" y="107.7" text-anchor="middle">검토</text>
  <path class="e" d="M544 103 H582" marker-end="url(#a)"/>
  <text class="sub" x="56" y="154" text-anchor="start">변경의 크기와 무관하게 네 번</text>
  <path class="rule" d="M56 182 H904"/>
  <text class="hd" x="56" y="218" text-anchor="start">개정</text>
  <text class="sub" x="100" y="218" text-anchor="start">바뀐 파일과 코드가 갈래를 고른다</text>
  <rect class="n q" x="56" y="305" width="84" height="38" rx="3"/>
  <text class="l q sm" x="98" y="328.7" text-anchor="middle">변경</text>
  <path class="e" d="M140 324 H174" marker-end="url(#a)"/>
  <rect class="n v" x="180" y="305" width="150" height="38" rx="3"/>
  <text class="l v sm" x="255" y="328.7" text-anchor="middle">위험 트리거 판정</text>
  <path class="e" d="M330 324 C364 324 372 250 400 250" marker-end="url(#a)"/>
  <path class="e" d="M330 324 H400" marker-end="url(#a)"/>
  <path class="e" d="M330 324 C364 324 372 398 400 398" marker-end="url(#a)"/>
  <rect class="n q" x="406" y="231" width="92" height="38" rx="3"/>
  <text class="l q sm" x="452" y="254.7" text-anchor="middle">검증만</text>
  <path class="e" d="M498 250 H532" marker-end="url(#a)"/>
  <rect class="n g" x="538" y="231" width="110" height="38" rx="3"/>
  <text class="l g sm" x="593" y="254.7" text-anchor="middle">빌드 확인</text>
  <text class="sub" x="406" y="289" text-anchor="start">위험 트리거 없는 문서 · 주석 · 테스트 코드</text>
  <rect class="n g" x="406" y="305" width="92" height="38" rx="3"/>
  <text class="l g sm" x="452" y="328.7" text-anchor="middle">기본</text>
  <path class="e" d="M498 324 H532" marker-end="url(#a)"/>
  <rect class="n g" x="538" y="305" width="228" height="38" rx="3"/>
  <text class="l g sm" x="652" y="328.7" text-anchor="middle">플랜 · 구현 · 테스트 · 빌드</text>
  <text class="sub" x="406" y="363" text-anchor="start">위험 트리거 없는 일반 코드 · 한 세션에서 완료</text>
  <rect class="n v" x="406" y="379" width="92" height="38" rx="3"/>
  <text class="l v sm" x="452" y="402.7" text-anchor="middle">게이트</text>
  <path class="e" d="M498 398 H532" marker-end="url(#a)"/>
  <rect class="n g" x="538" y="379" width="110" height="38" rx="3"/>
  <text class="l g sm" x="593" y="402.7" text-anchor="middle">기본 절차</text>
  <path class="e" d="M648 398 H682" marker-end="url(#a)"/>
  <rect class="n v" x="688" y="379" width="172" height="38" rx="3"/>
  <text class="l v sm" x="774" y="402.7" text-anchor="middle">A · B 독립 리뷰</text>
  <text class="sub" x="406" y="437" text-anchor="start">계약 · 인가 · 트랜잭션 등 · 두 리뷰어가 서로의 결과를 보지 않는다</text>
</svg>
