<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="360" height="780" viewBox="0 -6 360 780" role="img" aria-labelledby="t d">
  <title id="t">절차를 줄인 것이 아니라 갈래로 나눴다</title>
  <desc id="d">기존에는 어떤 코드 변경이든 플랜, 테스트 선행, 구현, 검토 네 단계를 각각 새 세션으로 거쳤다. 개정 후에는 위험 트리거 판정이 세 갈래를 고른다. 검증만은 빌드만 확인하고, 기본은 플랜부터 빌드까지 한 세션에서 마치며, 게이트는 기본 절차에 A와 B의 독립 리뷰를 더한다. 판정이 앞에 서므로 절차가 짧아진 것이 아니라 변경에 따라 갈라진 것이다.</desc>
  <style>
    /*
     * 공통 도해 문법 — docs/diagrams.md 참조. 9장이 같은 규칙을 쓴다.
     *
     * 색은 "무엇인가"가 아니라 "어떤 역할인가"를 말한다.
     *   g 초록  코드가 실제로 바뀌는 단계
     *   v 보라  사람이 기준을 정하거나 확인하는 지점 (문서 · 판정 · 리뷰 · 게이트)
     *   t 주황  경계 — 들어오고 나가는 지점, 그리고 되돌아간 비용
     *   q 회색  맥락. 이 그림의 주인공이 아닌 것
     * 한 칸은 면 · 선 · 글자를 같은 색 한 벌로 쓴다. 색이 역할이므로 강조용 테두리를
     * 따로 두지 않는다.
     *
     * 설명은 칸이 아니라 선과 여백이 한다. 칸 안에는 이름 한 줄만 넣고, 무엇이
     * 흐르는지는 선 위 이름표로, 그 칸이 무슨 일을 하는지는 칸 아래 작은 글로 쓴다.
     *
     * 이 파일은 빌드 때 본문에 인라인으로 들어간다(src/lib/inline-svg.mjs). 그래서
     * 규칙을 전부 .dg 아래에 두어 페이지의 다른 요소에 새지 않게 하고, 다크 값은
     * OS 설정이 아니라 사이트의 테마 토글(html[data-theme])을 따른다. 파일을 직접
     * 열면 라이트 값만 보인다.
     */
    .dg {
      --ink:#23211d; --ink2:#57534a; --hair:#cec8bb; --arrow:#a39c91;
      --g-fill:#e7f0ea; --g-line:#4e8f74; --g-text:#1d6b4f;
      --v-fill:#ecebf4; --v-line:#7d74ab; --v-text:#544a87;
      --t-fill:#f7ebe3; --t-line:#c07a4e; --t-text:#9c4a15;
      --q-fill:#f4f1ea; --q-line:#cec8bb; --q-text:#57534a;
    }
    :root[data-theme='dark'] .dg {
      --ink:#edeae3; --ink2:#a8a199; --hair:#3f3b35; --arrow:#6f685f;
      --g-fill:#1d2a24; --g-line:#3f7a5f; --g-text:#4fbe8f;
      --v-fill:#24222e; --v-line:#6a5f96; --v-text:#a396d8;
      --t-fill:#2c211a; --t-line:#8f5c38; --t-text:#d98b52;
      --q-fill:#2a2724; --q-line:#4a453e; --q-text:#a8a199;
    }
    /* 인라인이면 페이지의 Pretendard를 그대로 받는다. 직접 열었을 때만 시스템 고딕으로 떨어진다 */
    .dg text { font-family: 'Pretendard Variable', Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }

    .dg .n { stroke-width:1.5; }
    .dg .n.g { fill:var(--g-fill); stroke:var(--g-line); }
    .dg .n.v { fill:var(--v-fill); stroke:var(--v-line); }
    .dg .n.t { fill:var(--t-fill); stroke:var(--t-line); }
    .dg .n.q { fill:var(--q-fill); stroke:var(--q-line); }

    /* 색 클래스를 빠뜨려도 검게 떨어지지 않도록 기본값을 둔다 */
    .dg .l { font-size:15px; font-weight:700; fill:var(--ink); }
    .dg .l.g { fill:var(--g-text); } .dg .l.v { fill:var(--v-text); }
    .dg .l.t { fill:var(--t-text); } .dg .l.q { fill:var(--q-text); }
    .dg .l.sm { font-size:13.5px; }

    .dg .e { fill:none; stroke:var(--arrow); stroke-width:1.8; }
    .dg .e.d { stroke-dasharray:5 4; }
    .dg .e.t { stroke:var(--t-line); stroke-width:1.4; }
    .dg .ah { fill:var(--arrow); }
    .dg .el { font-size:13.5px; fill:var(--ink2); }

    .dg .sub { font-size:13px; fill:var(--ink2); }
    /* 그림이 가리키는 한 곳을 이름으로 부를 때. 가리키는 칸과 같은 색을 쓴다 */
    .dg .sub.g { fill:var(--g-text); font-weight:700; }
    .dg .sub.v { fill:var(--v-text); font-weight:700; }
    .dg .sub.t { fill:var(--t-text); font-weight:700; }
    .dg .hd { font-size:16px; font-weight:700; fill:var(--ink); }
    .dg .grp { fill:none; stroke:var(--hair); stroke-width:1.2; stroke-dasharray:5 4; }

    /*
     * 값을 재는 그림의 막대와 눈금. 칸(.n)은 옅은 면 + 테두리지만, 막대는 길이 자체가
     * 값이므로 테두리 없이 진한 면 하나로 칠한다. 색 뜻은 칸과 같다 — t는 되돌아간 비용.
     */
    .dg .bar { stroke:none; }
    .dg .bar.g { fill:var(--g-text); } .dg .bar.v { fill:var(--v-text); }
    .dg .bar.t { fill:var(--t-text); } .dg .bar.q { fill:var(--q-text); }
    .dg .tick { font-size:13px; fill:var(--ink2); }
    .dg .grid { fill:none; stroke:var(--hair); stroke-width:1; }
    /* 판 안을 가르는 실선. 선분이므로 fill:none을 반드시 준다 */
    .dg .rule { fill:none; stroke:var(--hair); stroke-width:1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <text class="hd" x="24" y="40" text-anchor="start">기존</text>
  <text class="sub" x="24" y="62" text-anchor="start">코드 변경마다 4단계 · 단계마다 새 세션</text>
  <rect class="n v" x="90" y="84" width="180" height="36" rx="3"/>
  <text class="l v sm" x="180" y="106.7" text-anchor="middle">플랜</text>
  <rect class="n g" x="90" y="140" width="180" height="36" rx="3"/>
  <text class="l g sm" x="180" y="162.7" text-anchor="middle">테스트 선행</text>
  <path class="e" d="M180 120 V134" marker-end="url(#a)"/>
  <rect class="n g" x="90" y="196" width="180" height="36" rx="3"/>
  <text class="l g sm" x="180" y="218.7" text-anchor="middle">구현</text>
  <path class="e" d="M180 176 V190" marker-end="url(#a)"/>
  <rect class="n v" x="90" y="252" width="180" height="36" rx="3"/>
  <text class="l v sm" x="180" y="274.7" text-anchor="middle">검토</text>
  <path class="e" d="M180 232 V246" marker-end="url(#a)"/>
  <text class="sub" x="24" y="330" text-anchor="start">변경의 크기와 무관하게 네 번</text>
  <path class="rule" d="M24 358 H336"/>
  <text class="hd" x="24" y="396" text-anchor="start">개정</text>
  <text class="sub" x="24" y="418" text-anchor="start">바뀐 파일과 코드가 갈래를 고른다</text>
  <rect class="n v" x="24" y="438" width="200" height="38" rx="3"/>
  <text class="l v sm" x="124" y="461.7" text-anchor="middle">위험 트리거 판정</text>
  <path class="e" d="M38 476 V688"/>
  <path class="e" d="M38 504 H50" marker-end="url(#a)"/>
  <rect class="n q" x="56" y="486" width="80" height="36" rx="3"/>
  <text class="l q sm" x="96" y="508.7" text-anchor="middle">검증만</text>
  <path class="e" d="M136 504 H158" marker-end="url(#a)"/>
  <rect class="n g" x="164" y="486" width="104" height="36" rx="3"/>
  <text class="l g sm" x="216" y="508.7" text-anchor="middle">빌드 확인</text>
  <text class="sub" x="56" y="540" text-anchor="start">위험 트리거 없는 문서 · 주석 · 테스트 코드</text>
  <path class="e" d="M38 594 H50" marker-end="url(#a)"/>
  <rect class="n g" x="56" y="576" width="68" height="36" rx="3"/>
  <text class="l g sm" x="90" y="598.7" text-anchor="middle">기본</text>
  <path class="e" d="M124 594 H146" marker-end="url(#a)"/>
  <rect class="n g" x="152" y="576" width="184" height="36" rx="3"/>
  <text class="l g sm" x="244" y="598.7" text-anchor="middle">플랜 · 구현 · 테스트 · 빌드</text>
  <text class="sub" x="56" y="636" text-anchor="start">위험 트리거 없는 일반 코드</text>
  <text class="sub" x="56" y="654" text-anchor="start">한 세션에서 완료</text>
  <path class="e" d="M38 684 H50" marker-end="url(#a)"/>
  <rect class="n v" x="56" y="666" width="80" height="36" rx="3"/>
  <text class="l v sm" x="96" y="688.7" text-anchor="middle">게이트</text>
  <path class="e" d="M136 684 H158" marker-end="url(#a)"/>
  <rect class="n v" x="164" y="666" width="148" height="36" rx="3"/>
  <text class="l v sm" x="238" y="688.7" text-anchor="middle">기본 + A · B 리뷰</text>
  <text class="sub" x="56" y="720" text-anchor="start">계약 · 인가 · 트랜잭션 등</text>
  <text class="sub" x="56" y="738" text-anchor="start">두 리뷰어가 서로의 결과를 보지 않는다</text>
</svg>
