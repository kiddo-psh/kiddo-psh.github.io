  <text class="hd" x="80" y="56">보낸 양은 같고, 결과는 다르다</text>
  <text class="sub" x="880" y="56" text-anchor="end">시드 5개 평균 · 가는 선은 최소–최대</text>
  <text class="ph" x="220" y="94">재시도 증폭률</text>
  <text class="ax" x="470" y="94" text-anchor="end">시도 수 ÷ 클라이언트 수</text>
  <text class="ph" x="560" y="94">최종 성공률</text>
