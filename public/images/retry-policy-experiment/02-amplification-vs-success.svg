  <path class="whisk" d="M668.8 228H681.6 M668.8 222v12 M681.6 222v12"/>
  <text class="val" x="691.6" y="233">36.1%</text>
  <text class="tick" x="80" y="279" font-weight="650">Full Jitter</text>
  <rect class="bar g" x="220" y="263" width="206.0" height="22" rx="4"/>
  <text class="val" x="434.0" y="279">5.77배</text>
  <rect class="bar g" x="560" y="263" width="272.8" height="22" rx="4"/>
  <path class="whisk" d="M826.6 274H839.4 M826.6 268v12 M839.4 268v12"/>
  <text class="val" x="849.4" y="279">85.3%</text>
  <path class="grid" d="M220 112V304 M560 112V304"/>
  <g class="ax" text-anchor="middle"><text x="220" y="324">0</text><text x="434.3" y="324">6배</text><text x="560" y="324">0%</text><text x="720.0" y="324">50%</text><text x="880" y="324">100%</text></g>
  <text class="sub" x="80" y="360">재시도하는 세 정책은 서버에 거의 같은 양(5.77–6.00배)을 보냈다. 달라진 것은 보낸 시점뿐이다.</text>
