<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 392" role="img" aria-labelledby="t d">
  <title id="t">재시도 증폭률과 최종 성공률</title>
  <desc id="d">정책 네 가지의 재시도 증폭률과 최종 성공률을 나란히 그린 막대그래프입니다. 시드 5개 평균입니다. 증폭률은 재시도 없음 1.00배, 고정 2초 6.00배, 지수 백오프 5.82배, Full Jitter 5.77배로 재시도를 하는 세 정책이 거의 같습니다. 최종 성공률은 0%, 17.4%, 36.1%, 85.3%로 크게 다릅니다. 가는 선은 시드 5개의 최솟값과 최댓값입니다.</desc>
  <style>
    /* diagram-theme:start */
/* Source of truth. Embedded into body SVGs by sync-diagram-theme.mjs. */
.dg {
  --ink:#333d4b; --ink2:#6b7684; --hair:#d1d6db; --arrow:#8b95a1;
  --g-fill:#eaf4ee; --g-line:#7da58e; --g-text:#246b50;
  --v-fill:#e7f2f2; --v-line:#65a0a1; --v-text:#21696d;
  --t-fill:#eef3df; --t-line:#98aa65; --t-text:#566b29;
