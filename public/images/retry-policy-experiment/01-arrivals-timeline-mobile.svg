<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 634" role="img" aria-labelledby="t d">
  <title id="t">정책별로 재시도가 서버에 도착한 모양</title>
  <desc id="d">클라이언트 300개가 같은 장애를 겪었을 때 100ms마다 서버에 도착한 요청 수를 정책별로 그린 그래프입니다. 처음 10초는 장애이고, 회복 뒤 서버는 100ms당 5건만 처리합니다. 고정 2초는 장애가 끝나는 10초 무렵에 한 번 크게 몰리고 끝납니다. 지수 백오프는 15초와 31초에 처리 한도의 약 10배인 파도가 오고, 그 사이에는 거의 아무것도 오지 않습니다. Full Jitter는 회복 뒤 최대 8건으로 처리 한도 근처에서 26초 무렵까지 고르게 퍼집니다.</desc>
