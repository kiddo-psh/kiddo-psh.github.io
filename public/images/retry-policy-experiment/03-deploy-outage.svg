<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 292" role="img" aria-labelledby="t d">
  <title id="t">backend 재생성 중 502가 이어진 시간</title>
  <desc id="d">실제 앱 서버에서 backend 컨테이너를 다시 만드는 동안 외부에서 0.2초 간격으로 API를 호출한 결과입니다. A는 재생성 직후 nginx reload를 했고, B는 하지 않았습니다. A는 명령 1.1초 뒤부터 37.7초까지 36.6초 동안 502가 173번, B는 0.9초부터 36.6초까지 35.6초 동안 502가 164번 돌아왔습니다. reload 유무와 관계없이 장애 길이가 거의 같습니다.</desc>
