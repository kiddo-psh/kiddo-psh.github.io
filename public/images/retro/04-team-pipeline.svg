<svg xmlns="http://www.w3.org/2000/svg" width="960" height="306" viewBox="0 0 960 306" role="img" aria-labelledby="t d">
  <title id="t">팀 공통 개발 파이프라인</title>
  <desc id="d">Task, Spec, Plan, Implement, Test, Review, Merge 일곱 단계. Spec과 Plan은 구현 전 판정 기준 합의, Test는 공통 검증 기준, Review는 설계 정합성과 규칙 확인을 담당한다. 저장소 루트의 AGENTS.md가 모든 단계에서 에이전트가 읽는 공통 규칙이 된다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --blue:#2a78d6; --blue-soft:#e3eefb; --warm:#e06b2e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --blue:#3987e5; --blue-soft:#1f3350; --warm:#f08a52; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .card.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .pill { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .pill.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .name { font-size: 16px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink2); }
    .col { font-size: 12.5px; font-weight: 600; fill: var(--ink2); letter-spacing: .04em; }
    .tag { font-size: 12.5px; font-weight: 700; fill: var(--blue); }
    .step { font-size: 15px; font-weight: 500; }
    .step.hi { font-weight: 700; }
    .who { font-size: 16px; font-weight: 700; }
    .how { font-size: 13px; fill: var(--ink2); }
    .flow { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
    .arrow { fill: var(--ink2); }
    .lg { font-size: 13px; fill: var(--ink2); }
    .lgbox { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
    .tile { fill: var(--bg2); stroke: var(--line); stroke-width: 1; }
    .big { font-size: 24px; font-weight: 700; }
    .lbl { font-size: 13px; fill: var(--ink2); }
    .brk { fill: none; stroke: var(--blue); stroke-width: 1.5; }
    .why { font-size: 13px; font-weight: 700; }
    .why2 { font-size: 12.5px; fill: var(--ink2); }
    .band { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .bandh { font-size: 15px; font-weight: 700; fill: var(--blue); }
    .bandt { font-size: 13px; fill: var(--ink2); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="306" rx="12"/>
  <rect class="pill" x="30" y="40" width="110" height="52" rx="26"/><text class="step" x="85" y="71" text-anchor="middle">Task</text>
  <path class="flow" d="M140 66 H155" marker-end="url(#ar)"/>
  <rect class="pill hi" x="158" y="40" width="110" height="52" rx="26"/><text class="step hi" x="213" y="71" text-anchor="middle">Spec</text>
  <path class="flow" d="M268 66 H283" marker-end="url(#ar)"/>
  <rect class="pill hi" x="286" y="40" width="110" height="52" rx="26"/><text class="step hi" x="341" y="71" text-anchor="middle">Plan</text>
  <path class="flow" d="M396 66 H411" marker-end="url(#ar)"/>
  <rect class="pill" x="414" y="40" width="110" height="52" rx="26"/><text class="step" x="469" y="71" text-anchor="middle">Implement</text>
  <path class="flow" d="M524 66 H539" marker-end="url(#ar)"/>
  <rect class="pill hi" x="542" y="40" width="110" height="52" rx="26"/><text class="step hi" x="597" y="71" text-anchor="middle">Test</text>
  <path class="flow" d="M652 66 H667" marker-end="url(#ar)"/>
  <rect class="pill hi" x="670" y="40" width="110" height="52" rx="26"/><text class="step hi" x="725" y="71" text-anchor="middle">Review</text>
  <path class="flow" d="M780 66 H795" marker-end="url(#ar)"/>
  <rect class="pill" x="798" y="40" width="110" height="52" rx="26"/><text class="step" x="853" y="71" text-anchor="middle">Merge</text>
  <path class="brk" d="M162 102 V110 H392 V102"/>
  <text class="why" x="277" y="132" text-anchor="middle">구현 전 판정 기준 합의</text>
  <text class="why2" x="277" y="150" text-anchor="middle">기준이 뒤집히는 재작업 감소</text>
  <path class="brk" d="M546 102 V110 H648 V102"/>
  <text class="why" x="597" y="132" text-anchor="middle">공통 검증 기준</text>
  <text class="why2" x="597" y="150" text-anchor="middle">테스트 누락 방지</text>
  <path class="brk" d="M674 102 V110 H776 V102"/>
  <text class="why" x="725" y="132" text-anchor="middle">설계 정합성 · 규칙 확인</text>
  <text class="why2" x="725" y="150" text-anchor="middle">Merge 전 차단</text>
  <rect class="band" x="30" y="184" width="878" height="54" rx="10"/>
  <text class="bandh" x="52" y="217">AGENTS.md</text>
  <text class="bandt" x="170" y="217">저장소 루트에 두고 모든 단계에서 에이전트가 읽는 공통 규칙 · 아키텍처 원칙 · 테스트 기준 · 커밋·이슈 규칙</text>
  <rect class="lgbox" x="30" y="266" width="14" height="14" rx="4"/>
  <text class="lg" x="52" y="278">지난 프로젝트에서 사람마다 달랐던 단계 · 팀 공통으로 고정</text>
</svg>
