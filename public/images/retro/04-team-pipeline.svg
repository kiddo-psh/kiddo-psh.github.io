<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="960" height="192" viewBox="0 36 960 192" role="img" aria-labelledby="t d">
  <title id="t">팀 공통으로 고정한 개발 순서</title>
  <desc id="d">Task, Spec, Plan, Implement, Test, Review, Merge 일곱 단계를 한 줄로 고정했다. Spec과 Plan은 구현 전 판정 기준을 합의하고, Test는 공통 검증 기준을, Review는 설계 정합성을 확인한다. 저장소 루트의 AGENTS.md는 특정 단계가 아니라 일곱 단계 전부에 걸린다.</desc>
  <style>
    /*
     * 공통 도해 문법 — docs/diagrams.md 참조. 9장이 같은 규칙을 쓴다.
     *
     * 색은 "무엇인가"가 아니라 "어떤 역할인가"를 말한다.
     *   g 초록  코드가 실제로 바뀌는 단계
     *   v 보라  사람이 기준을 정하거나 확인하는 지점 (문서 · 판정 · 리뷰 · 게이트)
     *   t 주황  경계 — 들어오고 나가는 지점, 그리고 되돌아간 비용
     *   q 회색  맥락. 이 그림의 주인공이 아닌 것
     * 한 칸은 면 · 선 · 글자를 같은 색 한 벌로 쓴다. 색이 역할이므로 강조용 테두리를
     * 따로 두지 않는다.
     *
     * 설명은 칸이 아니라 선과 여백이 한다. 칸 안에는 이름 한 줄만 넣고, 무엇이
     * 흐르는지는 선 위 이름표로, 그 칸이 무슨 일을 하는지는 칸 아래 작은 글로 쓴다.
     *
     * 이 파일은 빌드 때 본문에 인라인으로 들어간다(src/lib/inline-svg.mjs). 그래서
     * 규칙을 전부 .dg 아래에 두어 페이지의 다른 요소에 새지 않게 하고, 다크 값은
     * OS 설정이 아니라 사이트의 테마 토글(html[data-theme])을 따른다. 파일을 직접
     * 열면 라이트 값만 보인다.
     */
    .dg {
      --ink:#23211d; --ink2:#57534a; --hair:#cec8bb; --arrow:#a39c91;
      --g-fill:#e7f0ea; --g-line:#4e8f74; --g-text:#1d6b4f;
      --v-fill:#ecebf4; --v-line:#7d74ab; --v-text:#544a87;
      --t-fill:#f7ebe3; --t-line:#c07a4e; --t-text:#9c4a15;
      --q-fill:#f4f1ea; --q-line:#cec8bb; --q-text:#57534a;
    }
    :root[data-theme='dark'] .dg {
      --ink:#edeae3; --ink2:#a8a199; --hair:#3f3b35; --arrow:#6f685f;
      --g-fill:#1d2a24; --g-line:#3f7a5f; --g-text:#4fbe8f;
      --v-fill:#24222e; --v-line:#6a5f96; --v-text:#a396d8;
      --t-fill:#2c211a; --t-line:#8f5c38; --t-text:#d98b52;
      --q-fill:#2a2724; --q-line:#4a453e; --q-text:#a8a199;
    }
    /* 인라인이면 페이지의 Pretendard를 그대로 받는다. 직접 열었을 때만 시스템 고딕으로 떨어진다 */
    .dg text { font-family: 'Pretendard Variable', Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }

    .dg .n { stroke-width:1.5; }
    .dg .n.g { fill:var(--g-fill); stroke:var(--g-line); }
    .dg .n.v { fill:var(--v-fill); stroke:var(--v-line); }
    .dg .n.t { fill:var(--t-fill); stroke:var(--t-line); }
    .dg .n.q { fill:var(--q-fill); stroke:var(--q-line); }

    .dg .l { font-size:15px; font-weight:700; }
    .dg .l.g { fill:var(--g-text); } .dg .l.v { fill:var(--v-text); }
    .dg .l.t { fill:var(--t-text); } .dg .l.q { fill:var(--q-text); }
    .dg .l.sm { font-size:13.5px; }

    .dg .e { fill:none; stroke:var(--arrow); stroke-width:1.8; }
    .dg .e.d { stroke-dasharray:5 4; }
    .dg .e.t { stroke:var(--t-line); stroke-width:1.4; }
    .dg .ah { fill:var(--arrow); }
    .dg .el { font-size:13.5px; fill:var(--ink2); }

    .dg .sub { font-size:13px; fill:var(--ink2); }
    /* 그림이 가리키는 한 곳을 이름으로 부를 때. 가리키는 칸과 같은 색을 쓴다 */
    .dg .sub.g { fill:var(--g-text); font-weight:700; }
    .dg .sub.v { fill:var(--v-text); font-weight:700; }
    .dg .sub.t { fill:var(--t-text); font-weight:700; }
    .dg .hd { font-size:16px; font-weight:700; fill:var(--ink); }
    .dg .grp { fill:none; stroke:var(--hair); stroke-width:1.2; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <rect class="grp" x="40" y="68" width="880" height="128" rx="8"/>
  <text class="l sm v" x="58" y="90" text-anchor="start">AGENTS.md</text>
  <text class="sub" x="150" y="90" text-anchor="start">모든 단계에서 에이전트가 읽는 공통 규칙</text>
  <rect class="n q" x="58" y="104" width="100" height="38" rx="3"/>
  <text class="l q sm" x="108" y="127.7" text-anchor="middle">Task</text>
  <rect class="n v" x="182" y="104" width="100" height="38" rx="3"/>
  <text class="l v sm" x="232" y="127.7" text-anchor="middle">Spec</text>
  <path class="e" d="M161 123 H176" marker-end="url(#a)"/>
  <rect class="n v" x="306" y="104" width="100" height="38" rx="3"/>
  <text class="l v sm" x="356" y="127.7" text-anchor="middle">Plan</text>
  <path class="e" d="M285 123 H300" marker-end="url(#a)"/>
  <rect class="n g" x="430" y="104" width="100" height="38" rx="3"/>
  <text class="l g sm" x="480" y="127.7" text-anchor="middle">Implement</text>
  <path class="e" d="M409 123 H424" marker-end="url(#a)"/>
  <rect class="n g" x="554" y="104" width="100" height="38" rx="3"/>
  <text class="l g sm" x="604" y="127.7" text-anchor="middle">Test</text>
  <path class="e" d="M533 123 H548" marker-end="url(#a)"/>
  <rect class="n v" x="678" y="104" width="100" height="38" rx="3"/>
  <text class="l v sm" x="728" y="127.7" text-anchor="middle">Review</text>
  <path class="e" d="M657 123 H672" marker-end="url(#a)"/>
  <rect class="n t" x="802" y="104" width="100" height="38" rx="3"/>
  <text class="l t sm" x="852" y="127.7" text-anchor="middle">Merge</text>
  <path class="e" d="M781 123 H796" marker-end="url(#a)"/>
  <text class="sub" x="294" y="168" text-anchor="middle">구현 전 판정 기준 합의</text>
  <text class="sub" x="604" y="168" text-anchor="middle">공통 검증 기준</text>
  <text class="sub" x="728" y="168" text-anchor="middle">설계 정합성 확인</text>
</svg>
