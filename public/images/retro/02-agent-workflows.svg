<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">팀원별 에이전트 워크플로우</title>
  <desc id="d">Developer A는 Task, Code, Test, Merge 순서로 바로 구현했다. Developer B는 Task 뒤에 Spec과 Plan을 먼저 쓰고 Code, Review, Merge로 갔다. Developer C는 Task 뒤에 도메인 계약 문서를 먼저 정리하고 Refactor, Merge로 갔다. 규칙 파일은 프런트 2곳에만 있었고, 테스트 비중은 0에서 65퍼센트까지 벌어졌으며, 계획 문서를 쓴 팀원은 7명 중 1명이었다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --blue:#2a78d6; --blue-soft:#e3eefb; --warm:#e06b2e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --blue:#3987e5; --blue-soft:#1f3350; --warm:#f08a52; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .card.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .pill { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .pill.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .name { font-size: 16px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink2); }
    .col { font-size: 12.5px; font-weight: 600; fill: var(--ink2); letter-spacing: .04em; }
    .tag { font-size: 12.5px; font-weight: 700; fill: var(--blue); }
    .step { font-size: 15px; font-weight: 500; }
    .step.hi { font-weight: 700; }
    .who { font-size: 16px; font-weight: 700; }
    .how { font-size: 13px; fill: var(--ink2); }
    .flow { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
    .arrow { fill: var(--ink2); }
    .lg { font-size: 13px; fill: var(--ink2); }
    .lgbox { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
    .tile { fill: var(--bg2); stroke: var(--line); stroke-width: 1; }
    .big { font-size: 24px; font-weight: 700; }
    .lbl { font-size: 13px; fill: var(--ink2); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="440" rx="12"/>
  <text class="who" x="40" y="70">Developer A</text>
  <text class="how" x="40" y="90">기능을 바로 구현</text>
  <rect class="pill" x="220" y="44" width="100" height="48" rx="24"/><text class="step" x="270" y="73" text-anchor="middle">Task</text>
  <path class="flow" d="M320 68 H337" marker-end="url(#ar)"/>
  <rect class="pill" x="340" y="44" width="100" height="48" rx="24"/><text class="step" x="390" y="73" text-anchor="middle">Code</text>
  <path class="flow" d="M440 68 H457" marker-end="url(#ar)"/>
  <rect class="pill" x="460" y="44" width="100" height="48" rx="24"/><text class="step" x="510" y="73" text-anchor="middle">Test</text>
  <path class="flow" d="M560 68 H577" marker-end="url(#ar)"/>
  <rect class="pill" x="580" y="44" width="100" height="48" rx="24"/><text class="step" x="630" y="73" text-anchor="middle">Merge</text>
  <text class="who" x="40" y="166">Developer B (나)</text>
  <text class="how" x="40" y="186">스펙과 계획을 먼저 작성</text>
  <rect class="pill" x="220" y="140" width="100" height="48" rx="24"/><text class="step" x="270" y="169" text-anchor="middle">Task</text>
  <path class="flow" d="M320 164 H337" marker-end="url(#ar)"/>
  <rect class="pill hi" x="340" y="140" width="100" height="48" rx="24"/><text class="step hi" x="390" y="169" text-anchor="middle">Spec</text>
  <path class="flow" d="M440 164 H457" marker-end="url(#ar)"/>
  <rect class="pill hi" x="460" y="140" width="100" height="48" rx="24"/><text class="step hi" x="510" y="169" text-anchor="middle">Plan</text>
  <path class="flow" d="M560 164 H577" marker-end="url(#ar)"/>
  <rect class="pill" x="580" y="140" width="100" height="48" rx="24"/><text class="step" x="630" y="169" text-anchor="middle">Code</text>
  <path class="flow" d="M680 164 H697" marker-end="url(#ar)"/>
  <rect class="pill" x="700" y="140" width="100" height="48" rx="24"/><text class="step" x="750" y="169" text-anchor="middle">Review</text>
  <path class="flow" d="M800 164 H817" marker-end="url(#ar)"/>
  <rect class="pill" x="820" y="140" width="100" height="48" rx="24"/><text class="step" x="870" y="169" text-anchor="middle">Merge</text>
  <text class="who" x="40" y="262">Developer C</text>
  <text class="how" x="40" y="282">도메인 계약 문서를 먼저 정리</text>
  <rect class="pill" x="220" y="236" width="100" height="48" rx="24"/><text class="step" x="270" y="265" text-anchor="middle">Task</text>
  <path class="flow" d="M320 260 H337" marker-end="url(#ar)"/>
  <rect class="pill hi" x="340" y="236" width="130" height="48" rx="24"/><text class="step hi" x="405" y="265" text-anchor="middle">도메인 계약</text>
  <path class="flow" d="M470 260 H487" marker-end="url(#ar)"/>
  <rect class="pill" x="490" y="236" width="110" height="48" rx="24"/><text class="step" x="545" y="265" text-anchor="middle">Refactor</text>
  <path class="flow" d="M600 260 H617" marker-end="url(#ar)"/>
  <rect class="pill" x="620" y="236" width="100" height="48" rx="24"/><text class="step" x="670" y="265" text-anchor="middle">Merge</text>
  <rect class="lgbox" x="220" y="306" width="14" height="14" rx="4"/>
  <text class="lg" x="242" y="318">구현 전에 판단 기준을 문서로 고정하는 단계</text>
  <rect class="tile" x="40" y="346" width="280" height="70" rx="10"/>
  <text class="big" x="58" y="378">프런트 2곳</text>
  <text class="lbl" x="58" y="401">AGENTS.md가 있던 곳 · AI · HW · BE에는 없음</text>
  <rect class="tile" x="340" y="346" width="280" height="70" rx="10"/>
  <text class="big" x="358" y="378">0% ~ 65%</text>
  <text class="lbl" x="358" y="401">추가 코드 중 테스트 라인 비율 · 사람별</text>
  <rect class="tile" x="640" y="346" width="280" height="70" rx="10"/>
  <text class="big" x="658" y="378">7명 중 1명</text>
  <text class="lbl" x="658" y="401">계획·스펙 문서를 쓴 팀원</text>
</svg>
