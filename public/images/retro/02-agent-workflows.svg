  <rect class="n q" x="200" y="67.0" width="72" height="38" rx="3"/>
  <text class="l q sm" x="236" y="90.7" text-anchor="middle">Task</text>
  <rect class="n g" x="314" y="67.0" width="72" height="38" rx="3"/>
  <text class="l g sm" x="350" y="90.7" text-anchor="middle">Code</text>
  <path class="e" d="M276 86 H308" marker-end="url(#a)"/>
  <rect class="n g" x="428" y="67.0" width="72" height="38" rx="3"/>
  <text class="l g sm" x="464" y="90.7" text-anchor="middle">Test</text>
  <path class="e" d="M390 86 H422" marker-end="url(#a)"/>
  <rect class="n t" x="542" y="67.0" width="80" height="38" rx="3"/>
  <text class="l t sm" x="582" y="90.7" text-anchor="middle">Merge</text>
  <path class="e" d="M504 86 H536" marker-end="url(#a)"/>
  <text class="l sm q" x="56" y="171" text-anchor="start">Developer B (나)</text>
  <rect class="n q" x="200" y="147.0" width="72" height="38" rx="3"/>
  <text class="l q sm" x="236" y="170.7" text-anchor="middle">Task</text>
  <rect class="n v" x="314" y="147.0" width="72" height="38" rx="3"/>
  <text class="l v sm" x="350" y="170.7" text-anchor="middle">Spec</text>
  <path class="e" d="M276 166 H308" marker-end="url(#a)"/>
  <rect class="n v" x="428" y="147.0" width="72" height="38" rx="3"/>
  <text class="l v sm" x="464" y="170.7" text-anchor="middle">Plan</text>
  <path class="e" d="M390 166 H422" marker-end="url(#a)"/>
  <rect class="n g" x="542" y="147.0" width="72" height="38" rx="3"/>
  <text class="l g sm" x="578" y="170.7" text-anchor="middle">Code</text>
  <path class="e" d="M504 166 H536" marker-end="url(#a)"/>
  <rect class="n v" x="656" y="147.0" width="86" height="38" rx="3"/>
  <text class="l v sm" x="699" y="170.7" text-anchor="middle">Review</text>
  <path class="e" d="M618 166 H650" marker-end="url(#a)"/>
  <rect class="n t" x="784" y="147.0" width="80" height="38" rx="3"/>
  <text class="l t sm" x="824" y="170.7" text-anchor="middle">Merge</text>
  <path class="e" d="M746 166 H778" marker-end="url(#a)"/>
  <text class="l sm q" x="56" y="251" text-anchor="start">Developer C</text>
  <rect class="n q" x="200" y="227.0" width="72" height="38" rx="3"/>
  <text class="l q sm" x="236" y="250.7" text-anchor="middle">Task</text>
  <rect class="n v" x="314" y="227.0" width="118" height="38" rx="3"/>
  <text class="l v sm" x="373" y="250.7" text-anchor="middle">도메인 계약</text>
  <path class="e" d="M276 246 H308" marker-end="url(#a)"/>
  <rect class="n g" x="474" y="227.0" width="94" height="38" rx="3"/>
  <text class="l g sm" x="521" y="250.7" text-anchor="middle">Refactor</text>
  <path class="e" d="M436 246 H468" marker-end="url(#a)"/>
  <rect class="n t" x="610" y="227.0" width="80" height="38" rx="3"/>
  <text class="l t sm" x="650" y="250.7" text-anchor="middle">Merge</text>
  <path class="e" d="M572 246 H604" marker-end="url(#a)"/>
  <text class="sub" x="407" y="205" text-anchor="middle">구현 전에 판단 기준을 글로 고정</text>
  <text class="sub" x="373" y="285" text-anchor="middle">데이터가 거치는 상태를 먼저 약속</text>
  <text class="sub" x="640" y="91" text-anchor="start">문서 없이 바로 구현</text>
</svg>
