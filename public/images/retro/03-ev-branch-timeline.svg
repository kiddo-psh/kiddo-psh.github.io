<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
  <title id="t">7월 30일 타임라인과 코드 양 비교</title>
  <desc id="d">위: 팀원 A가 10시 37분에 235줄 기능을 커밋하고 점심 무렵까지 자체 리뷰 반영 3건을 했다. 나는 14시 43분부터 15시 20분까지 37분 동안 내 작업을 했고, 16시 6분부터 21시 37분까지 5시간 31분 동안 A의 브랜치를 재작업했다. 아래: A의 기능 커밋 235줄과 내 재작업 1,402줄을 막대로 비교했다. 재작업이 원본의 약 6배다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --blue:#2a78d6; --blue-soft:#e3eefb; --warm:#e06b2e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --blue:#3987e5; --blue-soft:#1f3350; --warm:#f08a52; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .card.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .pill { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .pill.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .name { font-size: 16px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink2); }
    .col { font-size: 12.5px; font-weight: 600; fill: var(--ink2); letter-spacing: .04em; }
    .tag { font-size: 12.5px; font-weight: 700; fill: var(--blue); }
    .step { font-size: 15px; font-weight: 500; }
    .step.hi { font-weight: 700; }
    .who { font-size: 16px; font-weight: 700; }
    .how { font-size: 13px; fill: var(--ink2); }
    .flow { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
    .arrow { fill: var(--ink2); }
    .lg { font-size: 13px; fill: var(--ink2); }
    .lgbox { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
    .tile { fill: var(--bg2); stroke: var(--line); stroke-width: 1; }
    .big { font-size: 24px; font-weight: 700; }
    .lbl { font-size: 13px; fill: var(--ink2); }
    .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .tick { font-size: 13px; fill: var(--ink2); }
    .dot { fill: var(--ink2); }
    .mine { fill: var(--blue); }
    .rework { fill: var(--warm); }
    .barlbl { font-size: 14px; font-weight: 700; }
    .num { font-size: 20px; font-weight: 700; }
    .div { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="450" rx="12"/>
  <g class="grid">
    <line x1="180" y1="50" x2="180" y2="258"/>
    <line x1="303" y1="50" x2="303" y2="258"/>
    <line x1="427" y1="50" x2="427" y2="258"/>
    <line x1="550" y1="50" x2="550" y2="258"/>
    <line x1="673" y1="50" x2="673" y2="258"/>
    <line x1="797" y1="50" x2="797" y2="258"/>
    <line x1="920" y1="50" x2="920" y2="258"/>
  </g>
  <line class="axis" x1="180" y1="258" x2="920" y2="258"/>
  <g class="tick" text-anchor="middle">
    <text x="180" y="278">10:00</text>
    <text x="303" y="278">12:00</text>
    <text x="427" y="278">14:00</text>
    <text x="550" y="278">16:00</text>
    <text x="673" y="278">18:00</text>
    <text x="797" y="278">20:00</text>
    <text x="920" y="278">22:00</text>
  </g>
  <text class="who" x="40" y="108">팀원 A</text>
  <circle class="dot" cx="218" cy="104" r="9"/>
  <text class="barlbl" x="234" y="86">기능 커밋 235줄</text>
  <circle class="dot" cx="345" cy="104" r="5"/><circle class="dot" cx="432" cy="104" r="5"/><circle class="dot" cx="442" cy="104" r="5"/>
  <text class="who" x="40" y="208">나</text>
  <rect class="mine" x="471" y="184" width="38" height="44" rx="6"/>
  <text class="how" x="471" y="246">내 작업 37분</text>
  <rect class="rework" x="556" y="184" width="341" height="44" rx="6"/>
  <text class="barlbl" x="556" y="172">A 브랜치 재작업 5시간 31분</text>
  <line class="div" x1="40" y1="300" x2="920" y2="300"/>
  <text class="who" x="40" y="340">기능 커밋</text>
  <rect class="dot" x="180" y="320" width="107" height="36" rx="6"/>
  <text class="num" x="299" y="346">235줄</text>
  <text class="who" x="40" y="408">재작업</text>
  <text class="how" x="40" y="428">약 6배 · 11 commits</text>
  <rect class="rework" x="180" y="388" width="640" height="36" rx="6"/>
  <text class="num" x="832" y="414">1,402줄</text>
</svg>
