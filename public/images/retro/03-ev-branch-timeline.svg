<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t3 d3">
  <title id="t3">7월 30일, 내 하루는 어디에 쓰였나</title>
  <desc id="d3">위: 팀원 A가 10시 37분에 235줄 기능을 커밋했다. 나는 14시 43분부터 15시 20분까지 37분 동안 내 작업을 했고, 16시 6분부터 21시 37분까지 5시간 31분 동안 A의 브랜치를 재작업했다. 아래: A의 기능 커밋 235줄과 내 재작업 1,402줄을 막대로 비교했다. 재작업이 원본의 약 6배다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --grid:#e4e3de; --blue:#2a78d6; --orange:#eb6834; --dot:#7a7975; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --grid:#2e2e2c; --blue:#3987e5; --orange:#d95926; --dot:#a3a29b; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink2); }
    .sec { font-size: 15px; font-weight: 700; }
    .lane { font-size: 16px; font-weight: 700; }
    .lane2 { font-size: 12px; fill: var(--ink2); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .tick { font-size: 12px; fill: var(--ink2); }
    .bar-me { fill: var(--blue); }
    .bar-rw { fill: var(--orange); }
    .bar-a { fill: var(--dot); }
    .cut { stroke: var(--bg); stroke-width: 2; }
    .dot { fill: var(--dot); }
    .dot-feat { fill: var(--dot); stroke: var(--bg); stroke-width: 2; }
    .ann { font-size: 15px; font-weight: 700; }
    .ann2 { font-size: 13px; fill: var(--ink2); }
    .val { font-size: 20px; font-weight: 700; }
    .rowlbl { font-size: 15px; font-weight: 600; }
    .rowsub { font-size: 12px; fill: var(--ink2); }
    .foot { font-size: 12px; fill: var(--ink2); }
    .lg { font-size: 12px; fill: var(--ink2); }
    .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="560" rx="12"/>

  <text class="title" x="40" y="42">7월 30일, 내 하루는 어디에 쓰였나</text>
  <text class="sub" x="40" y="64">EV 충전구역 장기 점유 판정 브랜치 · 커밋 시각 기준</text>

  <!-- legend -->
  <rect class="dot" x="640" y="32" width="10" height="10" rx="5"/><text class="lg" x="656" y="41">팀원 A의 커밋</text>
  <rect class="bar-me" x="750" y="32" width="12" height="10" rx="2"/><text class="lg" x="768" y="41">내 작업</text>
  <rect class="bar-rw" x="826" y="32" width="12" height="10" rx="2"/><text class="lg" x="844" y="41">A 브랜치 재작업</text>

  <!-- hour grid: x = 150 + (h-10)*64.167 -->
  <g class="grid">
    <line x1="150" y1="92" x2="150" y2="310"/><line x1="214.2" y1="92" x2="214.2" y2="310"/><line x1="278.3" y1="92" x2="278.3" y2="310"/>
    <line x1="342.5" y1="92" x2="342.5" y2="310"/><line x1="406.7" y1="92" x2="406.7" y2="310"/><line x1="470.8" y1="92" x2="470.8" y2="310"/>
    <line x1="535" y1="92" x2="535" y2="310"/><line x1="599.2" y1="92" x2="599.2" y2="310"/><line x1="663.3" y1="92" x2="663.3" y2="310"/>
    <line x1="727.5" y1="92" x2="727.5" y2="310"/><line x1="791.7" y1="92" x2="791.7" y2="310"/><line x1="855.8" y1="92" x2="855.8" y2="310"/>
    <line x1="920" y1="92" x2="920" y2="310"/>
  </g>

  <!-- Lane A -->
  <text class="lane" x="40" y="141">팀원 A</text>
  <text class="lane2" x="40" y="159">기능 브랜치</text>
  <circle class="dot-feat" cx="189.6" cy="135" r="10"/>
  <circle class="dot" cx="320" cy="135" r="5"/>
  <circle class="dot" cx="404.5" cy="135" r="5"/>
  <circle class="dot" cx="412" cy="135" r="5"/>
  <text class="ann" x="208" y="118">10:37 기능 커밋 · 235줄</text>
  <text class="ann2" x="320" y="166">A의 자체 리뷰 반영 3건</text>

  <!-- Lane Me -->
  <text class="lane" x="40" y="246">나</text>
  <text class="lane2" x="40" y="264">내 브랜치 → A의 브랜치</text>
  <rect class="bar-me" x="452.7" y="216" width="39.5" height="48" rx="4"/>
  <text class="ann" x="452" y="205">내 작업 · 37분 · 8 commits</text>
  <rect class="bar-rw" x="541.4" y="216" width="353.9" height="48" rx="4"/>
  <g class="cut">
    <line x1="551" y1="216" x2="551" y2="264"/><line x1="563.9" y1="216" x2="563.9" y2="264"/>
    <line x1="605.6" y1="216" x2="605.6" y2="264"/><line x1="628.1" y1="216" x2="628.1" y2="264"/>
    <line x1="648.4" y1="216" x2="648.4" y2="264"/><line x1="819.4" y1="216" x2="819.4" y2="264"/>
    <line x1="832.3" y1="216" x2="832.3" y2="264"/><line x1="865.4" y1="216" x2="865.4" y2="264"/>
    <line x1="871.8" y1="216" x2="871.8" y2="264"/>
  </g>
  <text class="ann" x="541" y="290">A 브랜치 재작업 · 5시간 31분 · 11 commits</text>

  <!-- axis -->
  <line class="axis" x1="150" y1="310" x2="920" y2="310"/>
  <text class="tick" x="150" y="330" text-anchor="middle">10:00</text>
  <text class="tick" x="214.2" y="330" text-anchor="middle">11:00</text>
  <text class="tick" x="278.3" y="330" text-anchor="middle">12:00</text>
  <text class="tick" x="342.5" y="330" text-anchor="middle">13:00</text>
  <text class="tick" x="406.7" y="330" text-anchor="middle">14:00</text>
  <text class="tick" x="470.8" y="330" text-anchor="middle">15:00</text>
  <text class="tick" x="535" y="330" text-anchor="middle">16:00</text>
  <text class="tick" x="599.2" y="330" text-anchor="middle">17:00</text>
  <text class="tick" x="663.3" y="330" text-anchor="middle">18:00</text>
  <text class="tick" x="727.5" y="330" text-anchor="middle">19:00</text>
  <text class="tick" x="791.7" y="330" text-anchor="middle">20:00</text>
  <text class="tick" x="855.8" y="330" text-anchor="middle">21:00</text>
  <text class="tick" x="920" y="330" text-anchor="middle">22:00</text>

  <!-- divider -->
  <line class="divider" x1="40" y1="356" x2="920" y2="356"/>
  <text class="sec" x="40" y="386">추가된 코드 양 비교</text>

  <!-- LOC bars: scale 1402 -> 580px, bars start x=260 -->
  <text class="rowlbl" x="40" y="425">A의 기능 커밋</text>
  <text class="rowsub" x="40" y="443">1 commit</text>
  <rect class="bar-a" x="260" y="405" width="97.2" height="40" rx="4"/>
  <text class="val" x="369" y="432">235줄</text>

  <text class="rowlbl" x="40" y="487">내 재작업</text>
  <text class="rowsub" x="40" y="505">11 commits · 원본의 약 6배</text>
  <rect class="bar-rw" x="260" y="467" width="580" height="40" rx="4"/>
  <text class="val" x="852" y="494">1,402줄</text>

  <text class="foot" x="40" y="540">같은 파일이 2,668줄에서 4,021줄로 늘었다. 재작업 커밋에는 판정 로직 수정과 함께 테스트·문서 보강이 포함돼 있다.</text>
</svg>
