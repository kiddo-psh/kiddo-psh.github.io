  <text class="tick" x="168" y="64" text-anchor="middle">10:00</text>
  <path class="grid" d="M168 74 V164"/>
  <text class="tick" x="290" y="64" text-anchor="middle">12:00</text>
  <path class="grid" d="M290 74 V164"/>
  <text class="tick" x="412" y="64" text-anchor="middle">14:00</text>
  <path class="grid" d="M412 74 V164"/>
  <text class="tick" x="534" y="64" text-anchor="middle">16:00</text>
  <path class="grid" d="M534 74 V164"/>
  <text class="tick" x="656" y="64" text-anchor="middle">18:00</text>
  <path class="grid" d="M656 74 V164"/>
  <text class="tick" x="778" y="64" text-anchor="middle">20:00</text>
  <path class="grid" d="M778 74 V164"/>
  <text class="tick" x="900" y="64" text-anchor="middle">22:00</text>
  <path class="grid" d="M900 74 V164"/>
  <text class="sub" x="156" y="99.5" text-anchor="end">팀원 A</text>
  <text class="sub" x="156" y="147.5" text-anchor="end">나</text>
  <rect class="bar q" x="205.617" y="86" width="84.3833" height="18" rx="4"/>
  <text class="sub" x="304" y="99" text-anchor="start">기능 커밋 235줄 · 이후 자체 리뷰 반영 3건</text>
  <rect class="bar g" x="455.717" y="134" width="37.6167" height="18" rx="4"/>
  <rect class="bar t" x="540.1" y="134" width="336.517" height="18" rx="4"/>
  <text class="sub" x="474.525" y="126" text-anchor="middle">내 작업 37분</text>
  <text class="sub" x="708.358" y="126" text-anchor="middle">A 브랜치 재작업 5시간 31분</text>
  <path class="rule" d="M56 196 H904"/>
  <text class="hd" x="56" y="224" text-anchor="start">그날 추가된 줄</text>
  <text class="sub" x="156" y="262" text-anchor="end">기능 커밋</text>
  <rect class="bar q" x="168" y="248" width="80.4565" height="20" rx="4"/>
  <text class="sub" x="262.456" y="262" text-anchor="start">235줄</text>
  <text class="sub" x="156" y="306" text-anchor="end">재작업</text>
  <rect class="bar t" x="168" y="292" width="480" height="20" rx="4"/>
  <text class="sub" x="662" y="306" text-anchor="start">1,402줄 · 11 커밋 · 약 6배</text>
</svg>
