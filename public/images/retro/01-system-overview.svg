<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="t d">
  <title id="t">시스템 구조</title>
  <desc id="d">현장의 천장 광각 카메라와 입구 카메라·ToF 센서가 엣지의 Jetson과 Raspberry Pi로, 거기서 서버의 Spring Backend로, 다시 사용자용 Mobile App과 Admin Web으로 흐른다. 이 글의 무대는 Jetson의 AI 차량 추적·구역 판정이다.</desc>
  <style>
    :root { --bg:#fcfcfb; --bg2:#f0efec; --ink:#0b0b0b; --ink2:#52514e; --line:#c9c8c2; --blue:#2a78d6; --blue-soft:#e3eefb; --warm:#e06b2e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a19; --bg2:#262625; --ink:#ffffff; --ink2:#c3c2b7; --line:#4a4a47; --blue:#3987e5; --blue-soft:#1f3350; --warm:#f08a52; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .card.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .pill { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
    .pill.hi { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .name { font-size: 16px; font-weight: 700; }
    .sub { font-size: 13px; fill: var(--ink2); }
    .col { font-size: 12.5px; font-weight: 600; fill: var(--ink2); letter-spacing: .04em; }
    .tag { font-size: 12.5px; font-weight: 700; fill: var(--blue); }
    .step { font-size: 15px; font-weight: 500; }
    .step.hi { font-weight: 700; }
    .who { font-size: 16px; font-weight: 700; }
    .how { font-size: 13px; fill: var(--ink2); }
    .flow { fill: none; stroke: var(--ink2); stroke-width: 1.6; }
    .arrow { fill: var(--ink2); }
    .lg { font-size: 13px; fill: var(--ink2); }
    .lgbox { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.5; }
    .tile { fill: var(--bg2); stroke: var(--line); stroke-width: 1; }
    .big { font-size: 24px; font-weight: 700; }
    .lbl { font-size: 13px; fill: var(--ink2); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="290" rx="12"/>
  <text class="col" x="128" y="40" text-anchor="middle">현장</text>
  <text class="col" x="364" y="40" text-anchor="middle">엣지</text>
  <text class="col" x="600" y="40" text-anchor="middle">서버</text>
  <text class="col" x="836" y="40" text-anchor="middle">사용자</text>
  <rect class="card" x="40" y="70" width="176" height="64" rx="10"/>
  <text class="name" x="128" y="97" text-anchor="middle">천장 광각 카메라</text>
  <text class="sub" x="128" y="118" text-anchor="middle">주차장 전경 영상</text>

  <rect class="card" x="40" y="190" width="176" height="64" rx="10"/>
  <text class="name" x="128" y="217" text-anchor="middle">입구 카메라 · ToF</text>
  <text class="sub" x="128" y="238" text-anchor="middle">번호판 · 차량 감지</text>

  <text class="tag" x="276" y="62">이 글의 무대</text>
  <rect class="card hi" x="276" y="70" width="176" height="64" rx="10"/>
  <text class="name" x="364" y="97" text-anchor="middle">Jetson</text>
  <text class="sub" x="364" y="118" text-anchor="middle">AI 차량 추적 · 구역 판정</text>

  <rect class="card" x="276" y="190" width="176" height="64" rx="10"/>
  <text class="name" x="364" y="217" text-anchor="middle">Raspberry Pi</text>
  <text class="sub" x="364" y="238" text-anchor="middle">입차 제어 · LED · 스피커</text>

  <rect class="card" x="512" y="130" width="176" height="64" rx="10"/>
  <text class="name" x="600" y="157" text-anchor="middle">Spring Backend</text>
  <text class="sub" x="600" y="178" text-anchor="middle">사건 · 세션 · 알림</text>

  <rect class="card" x="748" y="70" width="176" height="64" rx="10"/>
  <text class="name" x="836" y="97" text-anchor="middle">Mobile App</text>
  <text class="sub" x="836" y="118" text-anchor="middle">거주자 · 위반 알림</text>

  <rect class="card" x="748" y="190" width="176" height="64" rx="10"/>
  <text class="name" x="836" y="217" text-anchor="middle">Admin Web</text>
  <text class="sub" x="836" y="238" text-anchor="middle">관리자 · 사건 처리</text>

  <path class="flow" d="M216 102 H272" marker-end="url(#ar)"/>
  <path class="flow" d="M216 222 H272" marker-end="url(#ar)"/>
  <path class="flow" d="M452 222 H482 V162"/>
  <path class="flow" d="M452 102 H482 V162 H508" marker-end="url(#ar)"/>
  <path class="flow" d="M688 162 H718 V222 H744" marker-end="url(#ar)"/>
  <path class="flow" d="M718 162 V102 H744" marker-end="url(#ar)"/>
</svg>
