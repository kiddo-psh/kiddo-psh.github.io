  <text class="l g sm" x="592" y="118.7" text-anchor="middle">종합</text>
  <rect class="n t" x="688" y="95" width="110" height="38" rx="3"/>
  <text class="l t sm" x="743" y="118.7" text-anchor="middle">주간 코칭</text>
