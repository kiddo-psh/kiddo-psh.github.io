  <text class="sub" x="56" y="184" text-anchor="start">기록이 없어도 네 개 · 평균 LLM 호출 3.0회</text>
  <path class="rule" d="M56 212 H904"/>
  <text class="hd" x="56" y="248" text-anchor="start">동적 라우팅</text>
  <text class="sub" x="170" y="248" text-anchor="start">기록을 읽어 켤 Agent를 고른다</text>
  <rect class="n q" x="56" y="357" width="84" height="38" rx="3"/>
