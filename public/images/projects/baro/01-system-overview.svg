<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">시스템 구조</title>
  <desc id="d">센서 두 종류가 엣지 장치 둘로 들어가고, 두 장치가 Spring Backend로 결과를 보내며, Backend가 Mobile App과 Admin Web에 전달한다. 천장 광각 카메라는 주차장 전경 영상을, 입구 카메라와 ToF는 번호판과 차량 감지를 맡는다. Jetson이 AI 차량 추적과 구역 판정을, Raspberry Pi가 입차 제어와 LED · 스피커를 담당한다.</desc>
  <style>
    /*
     * 공통 도해 문법 — docs/diagrams.md 참조. 9장이 같은 규칙을 쓴다.
     *
     * 색은 "무엇인가"가 아니라 "어떤 역할인가"를 말한다.
     *   g 초록  코드가 실제로 바뀌는 단계
     *   v 보라  사람이 기준을 정하거나 확인하는 지점 (문서 · 판정 · 리뷰 · 게이트)
     *   t 주황  경계 — 들어오고 나가는 지점, 그리고 되돌아간 비용
     *   q 회색  맥락. 이 그림의 주인공이 아닌 것
     * 한 칸은 면 · 선 · 글자를 같은 색 한 벌로 쓴다. 색이 역할이므로 강조용 테두리를
     * 따로 두지 않는다.
     *
     * 설명은 칸이 아니라 선과 여백이 한다. 칸 안에는 이름 한 줄만 넣고, 무엇이
     * 흐르는지는 선 위 이름표로, 그 칸이 무슨 일을 하는지는 칸 아래 작은 글로 쓴다.
     */
    :root {
      --ink:#23211d; --ink2:#57534a; --hair:#cec8bb; --arrow:#a39c91;
      --g-fill:#e7f0ea; --g-line:#4e8f74; --g-text:#1d6b4f;
      --v-fill:#ecebf4; --v-line:#7d74ab; --v-text:#544a87;
      --t-fill:#f7ebe3; --t-line:#c07a4e; --t-text:#9c4a15;
      --q-fill:#f4f1ea; --q-line:#cec8bb; --q-text:#57534a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:#edeae3; --ink2:#a8a199; --hair:#3f3b35; --arrow:#6f685f;
        --g-fill:#1d2a24; --g-line:#3f7a5f; --g-text:#4fbe8f;
        --v-fill:#24222e; --v-line:#6a5f96; --v-text:#a396d8;
        --t-fill:#2c211a; --t-line:#8f5c38; --t-text:#d98b52;
        --q-fill:#2a2724; --q-line:#4a453e; --q-text:#a8a199;
      }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }

    .n { stroke-width:1.5; }
    .n.g { fill:var(--g-fill); stroke:var(--g-line); }
    .n.v { fill:var(--v-fill); stroke:var(--v-line); }
    .n.t { fill:var(--t-fill); stroke:var(--t-line); }
    .n.q { fill:var(--q-fill); stroke:var(--q-line); }

    .l { font-size:15px; font-weight:700; }
    .l.g { fill:var(--g-text); } .l.v { fill:var(--v-text); }
    .l.t { fill:var(--t-text); } .l.q { fill:var(--q-text); }
    .l.sm { font-size:13.5px; }

    .e { fill:none; stroke:var(--arrow); stroke-width:1.8; }
    .e.d { stroke-dasharray:5 4; }
    .e.t { stroke:var(--t-line); stroke-width:1.4; }
    .ah { fill:var(--arrow); }
    .el { font-size:13.5px; fill:var(--ink2); }

    .sub { font-size:13px; fill:var(--ink2); }
    /* 그림이 가리키는 한 곳을 이름으로 부를 때. 가리키는 칸과 같은 색을 쓴다 */
    .sub.g { fill:var(--g-text); font-weight:700; }
    .sub.v { fill:var(--v-text); font-weight:700; }
    .sub.t { fill:var(--t-text); font-weight:700; }
    .hd { font-size:16px; font-weight:700; fill:var(--ink); }
    .grp { fill:none; stroke:var(--hair); stroke-width:1.2; stroke-dasharray:5 4; }
    .rule { stroke:var(--hair); stroke-width:1; }

    .bar.g { fill:var(--g-text); } .bar.t { fill:var(--t-text); } .bar.q { fill:var(--q-line); }
    .tick { font-size:12.5px; fill:var(--ink2); }
    .grid { stroke:var(--hair); stroke-width:1; stroke-dasharray:2 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <rect class="n q" x="56" y="76" width="150" height="40" rx="3"/>
  <text class="l q" x="131" y="101.3" text-anchor="middle">천장 광각 카메라</text>
  <text class="sub" x="131" y="136" text-anchor="middle">주차장 전경 영상</text>
  <rect class="n q" x="56" y="186" width="150" height="40" rx="3"/>
  <text class="l q" x="131" y="211.3" text-anchor="middle">입구 카메라 · ToF</text>
  <text class="sub" x="131" y="246" text-anchor="middle">번호판 · 차량 감지</text>
  <rect class="n g" x="286" y="76" width="150" height="40" rx="3"/>
  <text class="l g" x="361" y="101.3" text-anchor="middle">Jetson</text>
  <text class="sub" x="361" y="136" text-anchor="middle">AI 차량 추적 · 구역 판정</text>
  <rect class="n g" x="286" y="186" width="150" height="40" rx="3"/>
  <text class="l g" x="361" y="211.3" text-anchor="middle">Raspberry Pi</text>
  <text class="sub" x="361" y="246" text-anchor="middle">입차 제어 · LED · 스피커</text>
  <rect class="n v" x="516" y="131" width="150" height="40" rx="3"/>
  <text class="l v" x="591" y="156.3" text-anchor="middle">Spring Backend</text>
  <text class="sub" x="591" y="191" text-anchor="middle">사건 · 세션 · 알림</text>
  <rect class="n t" x="746" y="76" width="150" height="40" rx="3"/>
  <text class="l t" x="821" y="101.3" text-anchor="middle">Mobile App</text>
  <text class="sub" x="821" y="136" text-anchor="middle">거주자 · 위반 알림</text>
  <rect class="n t" x="746" y="186" width="150" height="40" rx="3"/>
  <text class="l t" x="821" y="211.3" text-anchor="middle">Admin Web</text>
  <text class="sub" x="821" y="246" text-anchor="middle">관리자 · 사건 처리</text>
  <path class="e" d="M206 96 H278" marker-end="url(#a)"/>
  <path class="e" d="M206 206 H278" marker-end="url(#a)"/>
  <path class="e" d="M436 96 C470 96 478 151 508 151" marker-end="url(#a)"/>
  <path class="e" d="M436 206 C470 206 478 151 508 151" marker-end="url(#a)"/>
  <path class="e" d="M666 151 C700 151 708 96 738 96" marker-end="url(#a)"/>
  <path class="e" d="M666 151 C700 151 708 206 738 206" marker-end="url(#a)"/>
</svg>
