<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="960" height="268" viewBox="0 24 960 268" role="img" aria-labelledby="t d">
  <title id="t">지시를 늘리는 대신 루프를 닫는다</title>
  <desc id="d">모델에게 주는 것은 무엇을 만드는가, 무엇을 하면 안 되는가, 언제 끝났다고 보는가 셋이다. 방법은 모델이 고른다. 결과는 모델이 스스로 검증하고, 기준을 만족하면 완료로 나가고, 만족하지 못하면 다시 방법을 고르는 자리로 돌아간다. 단계를 지시하는 자리가 아니라 되돌아오는 선이 이 그림의 요지다.</desc>
  <style>
    /*
     * 공통 도해 문법 — docs/diagrams.md 참조. 9장이 같은 규칙을 쓴다.
     *
     * 색은 "무엇인가"가 아니라 "어떤 역할인가"를 말한다.
     *   g 초록  코드가 실제로 바뀌는 단계
     *   v 보라  사람이 기준을 정하거나 확인하는 지점 (문서 · 판정 · 리뷰 · 게이트)
     *   t 주황  경계 — 들어오고 나가는 지점, 그리고 되돌아간 비용
     *   q 회색  맥락. 이 그림의 주인공이 아닌 것
     * 한 칸은 면 · 선 · 글자를 같은 색 한 벌로 쓴다. 색이 역할이므로 강조용 테두리를
     * 따로 두지 않는다.
     *
     * 설명은 칸이 아니라 선과 여백이 한다. 칸 안에는 이름 한 줄만 넣고, 무엇이
     * 흐르는지는 선 위 이름표로, 그 칸이 무슨 일을 하는지는 칸 아래 작은 글로 쓴다.
     *
     * 이 파일은 빌드 때 본문에 인라인으로 들어간다(src/lib/inline-svg.mjs). 그래서
     * 규칙을 전부 .dg 아래에 두어 페이지의 다른 요소에 새지 않게 하고, 다크 값은
     * OS 설정이 아니라 사이트의 테마 토글(html[data-theme])을 따른다. 파일을 직접
     * 열면 라이트 값만 보인다.
     */
    .dg {
      --ink:#23211d; --ink2:#57534a; --hair:#cec8bb; --arrow:#a39c91;
      --g-fill:#e7f0ea; --g-line:#4e8f74; --g-text:#1d6b4f;
      --v-fill:#ecebf4; --v-line:#7d74ab; --v-text:#544a87;
      --t-fill:#f7ebe3; --t-line:#c07a4e; --t-text:#9c4a15;
      --q-fill:#f4f1ea; --q-line:#cec8bb; --q-text:#57534a;
    }
    :root[data-theme='dark'] .dg {
      --ink:#edeae3; --ink2:#a8a199; --hair:#3f3b35; --arrow:#6f685f;
      --g-fill:#1d2a24; --g-line:#3f7a5f; --g-text:#4fbe8f;
      --v-fill:#24222e; --v-line:#6a5f96; --v-text:#a396d8;
      --t-fill:#2c211a; --t-line:#8f5c38; --t-text:#d98b52;
      --q-fill:#2a2724; --q-line:#4a453e; --q-text:#a8a199;
    }
    /* 인라인이면 페이지의 Pretendard를 그대로 받는다. 직접 열었을 때만 시스템 고딕으로 떨어진다 */
    .dg text { font-family: 'Pretendard Variable', Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }

    .dg .n { stroke-width:1.5; }
    .dg .n.g { fill:var(--g-fill); stroke:var(--g-line); }
    .dg .n.v { fill:var(--v-fill); stroke:var(--v-line); }
    .dg .n.t { fill:var(--t-fill); stroke:var(--t-line); }
    .dg .n.q { fill:var(--q-fill); stroke:var(--q-line); }

    /* 색 클래스를 빠뜨려도 검게 떨어지지 않도록 기본값을 둔다 */
    .dg .l { font-size:15px; font-weight:700; fill:var(--ink); }
    .dg .l.g { fill:var(--g-text); } .dg .l.v { fill:var(--v-text); }
    .dg .l.t { fill:var(--t-text); } .dg .l.q { fill:var(--q-text); }
    .dg .l.sm { font-size:13.5px; }

    .dg .e { fill:none; stroke:var(--arrow); stroke-width:1.8; }
    .dg .e.d { stroke-dasharray:5 4; }
    .dg .e.t { stroke:var(--t-line); stroke-width:1.4; }
    .dg .ah { fill:var(--arrow); }
    .dg .el { font-size:13.5px; fill:var(--ink2); }

    .dg .sub { font-size:13px; fill:var(--ink2); }
    /* 그림이 가리키는 한 곳을 이름으로 부를 때. 가리키는 칸과 같은 색을 쓴다 */
    .dg .sub.g { fill:var(--g-text); font-weight:700; }
    .dg .sub.v { fill:var(--v-text); font-weight:700; }
    .dg .sub.t { fill:var(--t-text); font-weight:700; }
    .dg .hd { font-size:16px; font-weight:700; fill:var(--ink); }
    .dg .grp { fill:none; stroke:var(--hair); stroke-width:1.2; stroke-dasharray:5 4; }

    /*
     * 값을 재는 그림의 막대와 눈금. 칸(.n)은 옅은 면 + 테두리지만, 막대는 길이 자체가
     * 값이므로 테두리 없이 진한 면 하나로 칠한다. 색 뜻은 칸과 같다 — t는 되돌아간 비용.
     */
    .dg .bar { stroke:none; }
    .dg .bar.g { fill:var(--g-text); } .dg .bar.v { fill:var(--v-text); }
    .dg .bar.t { fill:var(--t-text); } .dg .bar.q { fill:var(--q-text); }
    .dg .tick { font-size:13px; fill:var(--ink2); }
    .dg .grid { fill:none; stroke:var(--hair); stroke-width:1; }
    /* 판 안을 가르는 실선. 선분이므로 fill:none을 반드시 준다 */
    .dg .rule { fill:none; stroke:var(--hair); stroke-width:1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <rect class="n v" x="56" y="56" width="190" height="38" rx="3"/>
  <text class="l v sm" x="151" y="79.7" text-anchor="middle">무엇을 만드는가</text>
  <path class="e" d="M246 75 C276 75 282 133 304 133" marker-end="url(#a)"/>
  <rect class="n v" x="56" y="114" width="190" height="38" rx="3"/>
  <text class="l v sm" x="151" y="137.7" text-anchor="middle">무엇을 하면 안 되는가</text>
  <path class="e" d="M246 133 C276 133 282 133 304 133" marker-end="url(#a)"/>
  <rect class="n v" x="56" y="172" width="190" height="38" rx="3"/>
  <text class="l v sm" x="151" y="195.7" text-anchor="middle">언제 끝났다고 보는가</text>
  <path class="e" d="M246 191 C276 191 282 133 304 133" marker-end="url(#a)"/>
  <rect class="n g" x="310" y="114" width="210" height="38" rx="3"/>
  <text class="l g sm" x="415" y="137.7" text-anchor="middle">모델이 방법을 고른다</text>
  <rect class="n v" x="580" y="114" width="130" height="38" rx="3"/>
  <text class="l v sm" x="645" y="137.7" text-anchor="middle">스스로 검증</text>
  <rect class="n t" x="780" y="114" width="110" height="38" rx="3"/>
  <text class="l t sm" x="835" y="137.7" text-anchor="middle">완료</text>
  <path class="e" d="M520 133 H574" marker-end="url(#a)"/>
  <path class="e" d="M710 133 H774" marker-end="url(#a)"/>
  <text class="el" x="742" y="124" text-anchor="middle">기준 만족</text>
  <path class="e t d" d="M645 152 C645 214 610 236 525 236 C440 236 415 214 415 152" marker-end="url(#a)"/>
  <text class="el" x="525" y="256" text-anchor="middle">아직 끝나지 않았다</text>
  <text class="sub" x="56" y="236" text-anchor="start">모델이 읽는 것은 이 셋이다</text>
</svg>
